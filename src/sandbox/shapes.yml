'@context':
  id: '@id'
  type: '@type'
  sh: https://w3.org/ns/shacl#
  xsd: http://xsd.org#
  cims: https://cims.org#
  prof: https://w3id.org/prof#
  skos: https://w3id.org/skos#
  dcterms: https://purl.org/dct#
  classes:
    '@id': sh:nodes
    '@index': rdfs:label
  attributes:
    '@id': sh:property
    '@index': sh:path
  class_uri:
    '@id': @id
id: https://www.ucaiug.io/prof-ap-cim/2.1#
type: owl:Ontology
rdfs:comment: This is pretty much how I would do it.
classes:
  Profile:
    class_uri: prof:Profile
    type: [sh:NodeShape, rdfs:Class]
    attributes:
      dcterms:description:
        minCardinality: 1
      dcterms:identifier:
        maxCardinality: 1
        datatype: xsd:string
  prof:ResourceDescriptor:
    type: [sh:NodeShape, rdfs:Class]
    property:
      adms:representationTechnique:
        minCardinality: 1
        node: cims:RepresentationTechhnique
      dcterms:identifier:
        maxCardinality: 1
        datatype: xsd:string
  cims:RepresentationTcnique:
    type: sh:NodeShape
    rdfs:label: RepresentationTechnique
    in:
      - '@id': cims:linkml
      - '@id': cims:shacl
