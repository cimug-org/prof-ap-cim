site:
  url: http://localhost:8000
  start_page: ROOT::index.adoc
content:
  sources:
    - url: ''
      branches: HEAD
      start_paths: docs-adoc/*
asciidoc:
  attributes:
    page-pagination: ''
    experimental: ''
    kroki-fetch-diagram: true
    kroki-default-format: svg@
    kroki-server-url: http://fruit.ritger.nl:9000
  extensions:
    - asciidoctor-kroki
output:
  clean: true
  dir: docs
ui:
  bundle:
    url: ../antora-ui-cimug-standard/build/ui-bundle.zip
